name: Refresh venues, events and team logos
on:
  schedule:
    - cron: '43 10 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-venues.mjs
      - run: node scripts/build-logos.mjs
      - run: node scripts/build-events.mjs
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/venues.json data/conferences.json data/logos.json data/events.json
          git diff --cached --quiet || git commit -m "Refresh venues, events and team logos"
          git push
